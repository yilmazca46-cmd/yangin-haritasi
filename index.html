            var radius = pt.frp > 15 ? 6.5 : 4.5;

            var marker = L.circleMarker([pt.lat, pt.lon], {
                radius: radius,
                fillColor: color,
                color: color,
                weight: 1.2,
                opacity: 0.9,
                fillOpacity: 0.85

                        .then(data => {

                                var c = data.current;
