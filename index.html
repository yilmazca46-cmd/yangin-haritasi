<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lena Consultancy - Doğrulanmış Türkiye Orman Yangınları KDS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #0f0f0f; font-family: Arial, sans-serif; }
        .kds-header { position: absolute; top: 15px; left: 55px; z-index: 1000; background: rgba(15,15,15,0.9); color: #fff; padding: 8px 16px; border-radius: 6px; border: 1px solid #444; font-size: 13px; }
        .legend { position: absolute; bottom: 30px; right: 20px; z-index: 1000; background: rgba(15,15,15,0.9); color: #fff; padding: 10px 14px; border-radius: 6px; border: 1px solid #444; font-size: 11px; line-height: 18px; }
    </style>
</head>
<body>
    <div class="kds-header">🌿 <b>Lena Consultancy</b> | Doğrulanmış Türkiye Orman Yangınları & Meteoroloji Katmanı</div>
    <div class="legend">
        <b>🌲 Orman Rejimi Yangın Analizi</b><br>
        <span style="color:#ff0000;">●</span> FRP &gt; 15 MW (Yüksek Şiddetli Orman Yangını)<br>
        <span style="color:#ff7800;">●</span> FRP 5 - 15 MW (Aktif Orman / Örtü Yangını)<br>
        <small style="color:#aaa;">Anız ve Tarımsal Odaklar Filtrelenmiştir</small>
    </div>
    <div id="map"></div>

    <script>
        var map = L.map('map', { center: [38.8, 35.0], zoom: 6 });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        var thermalData = [{"lat": 36.14, "lon": 29.57, "frp": 10.4}, {"lat": 36.3, "lon": 32.27, "frp": 6.9}, {"lat": 36.73, "lon": 36.21, "frp": 6.0}, {"lat": 36.82, "lon": 41.14, "frp": 27.7}, {"lat": 36.83, "lon": 41.14, "frp": 27.6}, {"lat": 36.92, "lon": 35.88, "frp": 12.0}, {"lat": 37.07, "lon": 36.06, "frp": 18.7}, {"lat": 37.08, "lon": 36.01, "frp": 9.4}, {"lat": 37.08, "lon": 36.02, "frp": 32.2}, {"lat": 37.08, "lon": 36.05, "frp": 31.6}, {"lat": 37.08, "lon": 36.06, "frp": 18.1}, {"lat": 37.08, "lon": 36.07, "frp": 18.1}, {"lat": 37.09, "lon": 36.01, "frp": 40.2}, {"lat": 37.11, "lon": 36.2, "frp": 8.2}, {"lat": 37.11, "lon": 36.21, "frp": 5.3}, {"lat": 37.15, "lon": 36.05, "frp": 48.8}, {"lat": 37.15, "lon": 36.06, "frp": 37.2}, {"lat": 37.16, "lon": 36.08, "frp": 5.3}, {"lat": 37.16, "lon": 37.29, "frp": 36.1}, {"lat": 37.17, "lon": 37.32, "frp": 32.8}, {"lat": 37.2, "lon": 35.78, "frp": 5.6}, {"lat": 37.24, "lon": 31.3, "frp": 11.9}, {"lat": 37.24, "lon": 31.31, "frp": 11.9}, {"lat": 37.24, "lon": 35.84, "frp": 11.3}, {"lat": 37.24, "lon": 35.85, "frp": 106.4}, {"lat": 37.25, "lon": 31.31, "frp": 19.3}, {"lat": 37.25, "lon": 35.84, "frp": 25.4}, {"lat": 37.25, "lon": 35.85, "frp": 106.4}, {"lat": 37.25, "lon": 35.91, "frp": 72.2}, {"lat": 37.25, "lon": 35.92, "frp": 8.4}, {"lat": 37.27, "lon": 35.83, "frp": 6.5}, {"lat": 37.28, "lon": 35.8, "frp": 8.5}, {"lat": 37.29, "lon": 35.82, "frp": 14.5}, {"lat": 37.35, "lon": 39.48, "frp": 27.2}, {"lat": 37.41, "lon": 36.91, "frp": 5.5}, {"lat": 37.48, "lon": 30.29, "frp": 9.6}, {"lat": 38.62, "lon": 39.3, "frp": 17.4}, {"lat": 38.62, "lon": 39.32, "frp": 18.0}, {"lat": 38.95, "lon": 34.65, "frp": 20.4}, {"lat": 39.12, "lon": 41.46, "frp": 8.1}, {"lat": 40.09, "lon": 44.24, "frp": 6.4}, {"lat": 40.26, "lon": 29.07, "frp": 5.9}, {"lat": 41.26, "lon": 31.43, "frp": 5.7}, {"lat": 42.07, "lon": 26.36, "frp": 10.0}];

        thermalData.forEach(function(pt) {
            var color = pt.frp > 15 ? "#ff0000" : "#ff7800";
            var radius = pt.frp > 15 ? 6.5 : 4.5;

            var marker = L.circleMarker([pt.lat, pt.lon], {
                radius: radius,
                fillColor: color,
                color: color,
                weight: 1.2,
                opacity: 0.9,
                fillOpacity: 0.85
            }).addTo(map);

            var initialPopup =
                "<div style='font-family:Arial; font-size:11px; color:#222; width:210px;'>" +
                "<b style='color:" + color + "; font-size:12px;'>🔥 Türkiye Orman Yangın Odağı</b><br>" +
                "<b>📍 Konum:</b> " + pt.lat + "°N, " + pt.lon + "°E<br>" +
                "<hr style='margin:4px 0; border-color:#ccc;'>" +
                "<b>🔥 Yangın Gücü (FRP):</b> " + pt.frp + " MW<br>" +
                "<b>🌡️ Sıcaklık:</b> ⏳ Tıklayınca Yükleniyor...<br>" +
                "<b>💧 Bağıl Nem:</b> ⏳ Tıklayınca Yükleniyor...<br>" +
                "<b>💨 Rüzgar Hızı:</b> ⏳ Tıklayınca Yükleniyor...<br>" +
                "<b>🧭 Rüzgar Yönü:</b> ⏳ Tıklayınca Yükleniyor..." +
                "</div>";

            marker.bindPopup(initialPopup);

            var loaded = false;
            var windLine = null;

            marker.on('click', function() {
                if (!loaded) {
                    var wUrl = "https://api.open-meteo.com/v1/forecast?latitude=" + pt.lat + "&longitude=" + pt.lon + "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m";

                    fetch(wUrl)
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.current) {
                                loaded = true;
                                var c = data.current;

                                var updatedPopup =
                                    "<div style='font-family:Arial; font-size:11px; color:#222; width:210px;'>" +
                                    "<b style='color:" + color + "; font-size:12px;'>🔥 Türkiye Orman Yangın Odağı</b><br>" +
                                    "<b>📍 Konum:</b> " + pt.lat + "°N, " + pt.lon + "°E<br>" +
                                    "<hr style='margin:4px 0; border-color:#ccc;'>" +
                                    "<b>🔥 Yangın Gücü (FRP):</b> " + pt.frp + " MW<br>" +
                                    "<b>🌡️ Sıcaklık:</b> " + c.temperature_2m + " °C<br>" +
                                    "<b>💧 Bağıl Nem:</b> %" + c.relative_humidity_2m + "<br>" +
                                    "<b>💨 Rüzgar Hızı:</b> " + c.wind_speed_10m + " km/s<br>" +
                                    "<b>🧭 Rüzgar Yönü:</b> " + c.wind_direction_10m + "°" +
                                    "</div>";

                                marker.getPopup().setContent(updatedPopup);

                                if (c.wind_direction_10m !== undefined && !windLine) {
                                    var rad = c.wind_direction_10m * (Math.PI / 180);
                                    var endLat = pt.lat - (0.025 * Math.cos(rad));
                                    var endLon = pt.lon - (0.025 * Math.sin(rad));

                                    windLine = L.polyline([[pt.lat, pt.lon], [endLat, endLon]], {
                                        color: color,
                                        weight: 2,
                                        opacity: 0.85
                                    }).addTo(map);
                                }
                            }
                        });
                }
            });
        });
    </script>
</body>
</html>
